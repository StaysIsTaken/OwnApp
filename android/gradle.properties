org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false

# Kotlin 2.4 bricht hier unter Windows beim Schliessen seiner inkrementellen
# Caches ab ("Could not close incremental caches"), und zwar in jedem
# Plugin-Modul, auch nach flutter clean und gestopptem Daemon. Ohne die
# inkrementelle Kompilierung laeuft der Build durch; er kostet dafuer bei
# Aenderungen etwas mehr Zeit. Sobald Kotlin das behoben hat, kann die Zeile
# wieder weg.
kotlin.incremental=false
