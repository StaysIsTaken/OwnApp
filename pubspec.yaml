name: productivity
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.1

dependencies:
  dio: ^5.11.1
  flutter:
    sdk: flutter
  http: ^1.6.0
  intl: ^0.20.3
  kanban_board: ^1.0.0+2
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5
  web_socket_channel: ^3.0.3
  flutter_local_notifications: ^22.3.0
  workmanager: ^0.10.10
  timezone: ^0.11.1
  permission_handler: ^12.0.0
  flutter_markdown: ^0.7.7+1
  table_calendar: ^3.2.1
  file_picker: ^12.2.0
  record: ^6.2.1

  # Damit sich Zeit in Tests stellen laesst. `DateTime.now()` laesst sich
  # nicht faelschen, und ein Gueltigkeitsfenster, das sich nicht ablaufen
  # laesst, ist ein ungeprueftes Fenster.
  clock: ^1.1.1
  path_provider: ^2.1.4
  cross_file: ^0.3.5+5
  mobile_scanner: ^7.4.0
  image_picker: ^1.1.2
  geolocator: ^14.0.3
  # Anmeldung per Face ID / Fingerabdruck: local_auth macht die Pruefung auf
  # dem Geraet, flutter_secure_storage legt die Zugangsdaten in die Keychain
  # (iOS) bzw. den Keystore (Android) statt in SharedPreferences.
  local_auth: ^3.0.2
  # Diagramme fuer die selbst zusammengestellten Kacheln. Reines Dart,
  # laeuft auf allen Plattformen einschliesslich Web.
  fl_chart: ^1.2.0
  flutter_secure_storage: ^10.0.0
  audioplayers: ^6.8.1
  # Sprachausgabe des Kuechen-Assistenten. Bewusst die Stimme des
  # Betriebssystems und kein Server-Dienst: sie antwortet ohne Netzwerkweg.
  flutter_tts: ^4.0.2
  # Haelt den Bildschirm im Kuechenmodus an. Ein Dashboard, das nach zwei
  # Minuten schwarz wird, ist keins.
  wakelock_plus: ^1.2.5
  # Weckworterkennung auf dem Geraet. Apache-2.0, ohne Konto und ohne
  # Zugangsschluessel -- der Grund, warum hier nicht Porcupine steht: dessen
  # AccessKey gibt es nur ueber eine Anmeldung, die eine Firmen-Adresse
  # verlangt. Schluesselwoerter stehen bei sherpa als Text in
  # assets/kws/keywords.txt und lassen sich jederzeit aendern.
  sherpa_onnx: ^1.13.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Kam bisher nur ueber flutter_test herein. Der Timer-Test steuert damit
  # die Uhr, statt echte Sekunden abzuwarten — deshalb steht sie jetzt hier.
  fake_async: ^1.3.3

# record 5.x zieht sonst das veraltete record_linux 0.7.2, das die neuere
# record_platform_interface (1.6.0, von record_android/windows genutzt) nicht
# implementiert -> Build-Fehler. Wir heben record_linux auf eine passende
# Version, die zum Interface 1.6.0 passt (alle anderen Plattformen bleiben gleich).
dependency_overrides:
  record_linux: ^1.3.1

flutter:
  uses-material-design: true

  assets:
    # Der Ton, mit dem sich der Kuechen-Timer meldet.
    - assets/sounds/
    # Weckwort-Modell (zipformer-KWS, int8, zusammen ~5 MB) und die
    # Schluesselwortliste. Wird beim ersten Start in den Dokumentenordner
    # kopiert, weil die ONNX-Laufzeit echte Dateipfade braucht und kein
    # Flutter-Asset lesen kann.
    - assets/kws/
